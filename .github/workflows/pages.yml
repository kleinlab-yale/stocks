name: Refresh market data & publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "8,23,38,53 4-20 * * 1-5"
      timezone: "America/New_York"
    - cron: "11 21 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install market data reader
        run: pip install -r scripts/requirements.txt

      - name: Refresh market snapshot
        run: python scripts/fetch_market_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      # Checkpoint only after publishing, so saving history cannot delay prices.
      # Daily data commits keep GitHub's 60-day inactivity rule from pausing us.
      - name: Save market checkpoint
        if: github.event_name != 'schedule' || github.event.schedule == '11 21 * * *'
        run: |
          if git diff --quiet -- site/data/market.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/market.json
          git commit -m 'Save daily market snapshot'
          for attempt in 1 2 3; do
            # Only the generated snapshot is replayed. Prefer its newest data
            # if another completed run saved a checkpoint during this run.
            git pull --rebase --strategy-option=theirs origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
