<svg xmlns="http://www.w3.org/2000/svg" width="1732" height="908" viewBox="0 0 1732 908" role="img" aria-labelledby="title description">
  <title id="title">TickerQuest Family Portfolio League</title>
  <desc id="description">Up to ten players, stocks and crypto, one champion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020b09"/>
      <stop offset="0.58" stop-color="#03100d"/>
      <stop offset="1" stop-color="#061b14"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
