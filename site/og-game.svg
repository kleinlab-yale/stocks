    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb19f"/>
      <stop offset="1" stop-color="#df5d43"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="86.6" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M86.6 0H0V86.6" fill="none" stroke="#b8ff65" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1732" height="908" fill="url(#background)"/>
