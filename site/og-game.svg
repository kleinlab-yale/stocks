  <rect x="30" y="30" width="1672" height="848" rx="29" fill="url(#grid)"/>

  <text x="866" y="214" fill="url(#mint)" font-family="Inter, Arial, sans-serif" font-size="145" font-weight="850" letter-spacing="-7" text-anchor="middle">TICKERQUEST</text>
  <text x="866" y="304" fill="#dfece6" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="760" letter-spacing="2" text-anchor="middle">
